<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Age of War — 1v1 online: оригинальная игра или лёгкая версия." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>Age of War P2P</title>
    <style>
      :root { color-scheme: light; --gold: #ffd447; --line: #35210b; --cream: #fff3d2; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        background: linear-gradient(180deg, #3fb1ff 0%, #9fdcff 58%, #4f8a35 58%, #6b4a26 78%); color: var(--cream); font: 16px/1.4 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; }
      main { width: min(920px, 100%); text-align: center; }
      h1 { font: 900 clamp(2.4rem, 8vw, 4.6rem)/0.95 Georgia, 'Palatino Linotype', serif; letter-spacing: .06em; margin: 0 0 6px; color: transparent;
        background: linear-gradient(180deg, #fff6a8, #ffd447 45%, #c98b0a); -webkit-background-clip: text; background-clip: text; -webkit-text-stroke: 2px #4a2d05; paint-order: stroke fill;
        filter: drop-shadow(0 4px 0 #4a2d05) drop-shadow(0 10px 18px #0006); }
      p.sub { margin: 0 0 24px; color: #fff; font-weight: 700; text-shadow: 0 2px 0 #0008; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
      a.card { display: flex; flex-direction: column; gap: 8px; text-align: left; padding: 20px; border-radius: 16px; color: inherit; text-decoration: none;
        background: linear-gradient(180deg, #b98040, #8c5b2b 55%, #5d3b19); border: 2px solid var(--line);
        box-shadow: 0 4px 0 #2a1807, 0 14px 28px #0005, inset 0 2px 0 #ffffff38; text-shadow: 0 1px 0 #0008; transition: transform .12s, filter .15s; }
      a.card:hover, a.card:focus-visible { transform: translateY(-4px); filter: brightness(1.08); outline: none; }
      .tag { align-self: flex-start; font-size: .72rem; font-weight: 800; padding: 2px 10px; border-radius: 99px; background: var(--gold); color: #2b1a08; text-shadow: none; }
      .name { font-size: 1.5rem; font-weight: 900; }
      ul { margin: 4px 0 0; padding-left: 18px; font-size: .92rem; opacity: .92; }
      .go { margin-top: auto; padding-top: 10px; font-weight: 900; color: var(--gold); }
      #lang button { border: 0; border-radius: 99px; padding: 5px 13px; font: 800 .85rem 'Trebuchet MS', system-ui, sans-serif; cursor: pointer; background: transparent; color: var(--cream); }
      #lang button.on { background: var(--gold); color: #2b1a08; }
      footer { margin-top: 22px; color: #fff; font-size: .8rem; text-shadow: 0 1px 0 #0008; }
    </style>
  </head>
  <body>
    <div id="lang" style="position:fixed;top:12px;right:12px;display:flex;gap:2px;background:#0004;border:2px solid #35210b;border-radius:99px;padding:2px">
      <button data-l="ru">RU</button><button data-l="en">EN</button>
    </div>
    <main>
      <h1>AGE OF WAR</h1>
      <p class="sub" id="sub"></p>
      <div class="cards">
        <a class="card" id="orig" href="./original.html">
          <span class="tag" id="t1"></span>
          <span class="name" id="n1"></span>
          <ul id="l1"></ul>
          <span class="go" id="g1"></span>
        </a>
        <a class="card" id="lite" href="./lite.html">
          <span class="tag" id="t2"></span>
          <span class="name" id="n2"></span>
          <ul id="l2"></ul>
          <span class="go" id="g2"></span>
        </a>
      </div>
      <footer id="foot"></footer>
    </main>
    <script>
      var T = {
        ru: { sub: 'Выбери версию. Онлайн 1 на 1 с другом есть в обеих.', t1: 'РЕКОМЕНДУЕМ', n1: 'Оригинал', l1: ['Оригинальная игра на современном движке', 'Оригинальные графика, анимации, звуки и правила', 'Поле боя на весь экран, новый интерфейс', 'Умный бот и честная экономика (или классика)'], t2: 'ЛЁГКАЯ', n2: 'Всраатая', l2: ['Моя первая версия с нуля, без оригинальных ассетов', 'Грузится мгновенно, мало трафика', 'Удобна на слабых телефонах'], go: 'Играть →', foot: 'Ссылка-приглашение друга откроет нужную версию автоматически.' },
        en: { sub: 'Pick a version. 1v1 online with a friend works in both.', t1: 'RECOMMENDED', n1: 'Original', l1: ['The original game on a modern engine', 'Original art, animations, sounds and rules', 'Full-screen battlefield, brand-new interface', 'Smart bot with a fair economy (or classic)'], t2: 'LITE', n2: 'Vsraataya (the janky one)', l2: ['My first from-scratch version, no original assets', 'Instant load, tiny download', 'Easy on weak phones'], go: 'Play →', foot: 'A friend’s invite link opens the right version automatically.' }
      };
      function pick() {
        try { var s = localStorage.getItem('aow.lang'); if (s === 'ru' || s === 'en') return s; } catch (e) {}
        return /^ru/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '') ? 'ru' : 'en';
      }
      function set(id, v) { document.getElementById(id).textContent = v; }
      function list(id, a) { var ul = document.getElementById(id); ul.innerHTML = ''; a.forEach(function (x) { var li = document.createElement('li'); li.textContent = x; ul.appendChild(li); }); }
      function apply(l) {
        var t = T[l];
        set('sub', t.sub); set('t1', t.t1); set('n1', t.n1); list('l1', t.l1); set('g1', t.go);
        set('t2', t.t2); set('n2', t.n2); list('l2', t.l2); set('g2', t.go); set('foot', t.foot);
        document.documentElement.lang = l;
        document.querySelectorAll('#lang button').forEach(function (b) { b.className = b.getAttribute('data-l') === l ? 'on' : ''; });
      }
      document.querySelectorAll('#lang button').forEach(function (b) {
        b.addEventListener('click', function () { var l = b.getAttribute('data-l'); try { localStorage.setItem('aow.lang', l); } catch (e) {} apply(l); });
      });
      apply(pick());
      var h = location.hash || '';
      document.getElementById('orig').href = './original.html' + h;
      document.getElementById('lite').href = './lite.html' + h;
    </script>
  </body>
</html>
