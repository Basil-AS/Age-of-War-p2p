name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - name: Firefox (cross-browser smoke)
        run: CROSS_BROWSER=1 npx playwright test --project=firefox
      - name: WebKit (cross-browser smoke, informational)
        continue-on-error: true
        run: CROSS_BROWSER=1 npx playwright test --project=webkit
