# Your own low-latency infrastructure on any VPS (pick a city close to both players):
#   cp .env.example .env  &&  edit  &&  docker compose up -d
# Then build the site with:
#   VITE_TURN="turn:HOST:3478?transport=udp,turns:HOST:443?transport=tcp|USER|PASS" VITE_WS_RELAY=wss://HOST/relay npm run build
services:
  coturn:
    image: coturn/coturn:latest
    network_mode: host
    restart: unless-stopped
    command: >
      -n --realm=${DOMAIN} --fingerprint --lt-cred-mech --user=${TURN_USER}:${TURN_PASS}
      --listening-port=3478 --tls-listening-port=5349 --min-port=49160 --max-port=49200
      --no-cli --no-multicast-peers --no-tlsv1 --no-tlsv1_1
  relay:
    image: node:22-alpine
    working_dir: /app
    volumes: ["../server:/app/server:ro", "../node_modules:/app/node_modules:ro"]
    command: node server/relay.mjs
    environment: { PORT: "8787" }
    restart: unless-stopped
    ports: ["127.0.0.1:8787:8787"]
  caddy:
    image: caddy:2
    network_mode: host
    restart: unless-stopped
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data"]
volumes: { caddy: {} }
